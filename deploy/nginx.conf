# Nginx para www.deepbiodata.com — espejo de netlify.toml (redirects, 404 por
# idioma, cabeceras y cache). El sitio lo sirve el proceso Node de Astro
# (dist/server/entry.mjs) en 127.0.0.1:4321; nginx añade estáticos directos y TLS.
#
# Instalación:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/deepbiodata.conf
#   sudo ln -s /etc/nginx/sites-available/deepbiodata.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # TLS cuando el DNS apunte al servidor:
#   sudo certbot --nginx -d deepbiodata.com -d www.deepbiodata.com

server {
    listen 80;
    listen [::]:80;
    server_name deepbiodata.com www.deepbiodata.com;

    # La raíz redirige al inglés (estructura trilingue simétrica).
    location = / {
        return 301 /en/;
    }

    # URLs inglesas antiguas sin prefijo: 301 a su equivalente /en/ (SEO).
    location ~ ^/(contact|works|team|services|gep|accessibility|legal-notice|privacy-policy|cookies-policy)/?$ {
        return 301 /en/$1/;
    }

    # Recursos con hash: cache inmutable, servidos directo del build.
    location /_astro/ {
        root /var/www/deepbiodata/dist/client;
        include snippets/deepbiodata-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;
    }

    location /assets/ {
        root /var/www/deepbiodata/dist/client;
        include snippets/deepbiodata-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    # Formulario de contacto: siempre al proceso Node (endpoint con estado).
    location /api/ {
        include snippets/deepbiodata-headers.conf;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Resto: proxy al Node de Astro. Una URL inexistente bajo /en/, /es/ o /pt/
    # devuelve la 404 localizada de ese idioma (equivalente a netlify.toml).
    location /en/ {
        include snippets/deepbiodata-headers.conf;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 /en/404/index.html;
    }

    location /es/ {
        include snippets/deepbiodata-headers.conf;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 /es/404/index.html;
    }

    location /pt/ {
        include snippets/deepbiodata-headers.conf;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 /pt/404/index.html;
    }

    location / {
        include snippets/deepbiodata-headers.conf;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
