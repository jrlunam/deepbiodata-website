[build]
  command = "npm run build"
  publish = "dist"

# Migración a prefijos por idioma: las URLs inglesas antiguas (sin prefijo)
# responden 301 hacia su equivalente /en/ para no perder posicionamiento.
[[redirects]]
  from = "/contact"
  to = "/en/contact/"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/en/contact/"
  status = 301
[[redirects]]
  from = "/works"
  to = "/en/works/"
  status = 301
[[redirects]]
  from = "/works/"
  to = "/en/works/"
  status = 301
[[redirects]]
  from = "/team"
  to = "/en/team/"
  status = 301
[[redirects]]
  from = "/team/"
  to = "/en/team/"
  status = 301
[[redirects]]
  from = "/services"
  to = "/en/services/"
  status = 301
[[redirects]]
  from = "/services/"
  to = "/en/services/"
  status = 301
[[redirects]]
  from = "/gep"
  to = "/en/gep/"
  status = 301
[[redirects]]
  from = "/gep/"
  to = "/en/gep/"
  status = 301
[[redirects]]
  from = "/accessibility"
  to = "/en/accessibility/"
  status = 301
[[redirects]]
  from = "/accessibility/"
  to = "/en/accessibility/"
  status = 301
[[redirects]]
  from = "/legal-notice"
  to = "/en/legal-notice/"
  status = 301
[[redirects]]
  from = "/legal-notice/"
  to = "/en/legal-notice/"
  status = 301
[[redirects]]
  from = "/privacy-policy"
  to = "/en/privacy-policy/"
  status = 301
[[redirects]]
  from = "/privacy-policy/"
  to = "/en/privacy-policy/"
  status = 301
[[redirects]]
  from = "/cookies-policy"
  to = "/en/cookies-policy/"
  status = 301
[[redirects]]
  from = "/cookies-policy/"
  to = "/en/cookies-policy/"
  status = 301

# 404 localizadas: una URL inexistente bajo /en/, /es/ o /pt/ sirve la 404 de
# su idioma (con header, pie y conmutador en ese idioma).
# Sin force: las paginas reales tienen prioridad sobre el redirect.
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

[[redirects]]
  from = "/es/*"
  to = "/es/404/"
  status = 404

[[redirects]]
  from = "/pt/*"
  to = "/pt/404/"
  status = 404

# La raiz pasa a /en/ (estructura trilingue simetrica).
# force=true: Astro genera ademas un index.html de fallback con meta-refresh.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

# La rama main produce el sitio de producción.
# Cualquier otra rama (dev) produce deploy previews con su propia URL temporal:
# nunca tocan deepbiodata.com ni la URL de producción.
[context.production]
  branch = "main"

[context.branch-deploy]
  command = "npm run build"
  publish = "dist"

[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

# Cabeceras de seguridad (hardening general)
[[headers]]
  for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  Cross-Origin-Opener-Policy = "same-origin"
  X-XSS-Protection = "0"
  Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Cache largo para recursos con hash / estáticos
[[headers]]
  for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=2592000"

# HTML siempre revalidado
[[headers]]
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

